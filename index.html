
    <meta charset="UTF-8">
    <title>Meran Alyas | TIGER Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Go

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        /* Matrix Rain Effect */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            opacity: 0.6;
        }

        .matrix-column {
            position: absolute;
            top: -50%;
            width: 2px;
            height: 120px;
            background: linear-gradient(180deg, transparent, #00b4d8, #0077b6);
            box-shadow: 0 0 8px rgba(0, 150, 255, 0.9), 0 0 3px rgba(0, 212, 255, 0.7);
            animation: rainFall linear infinite;
        }

        @keyframes rainFall {
            0% { transform: translateY(-120px); }
            100% { transform: translateY(120vh); }
        }

        /* Navigation Buttons */
        .nav-container {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .nav-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.6));
            color: #e2e8f0;
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 14px;
            padding: 10px 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            outline: none;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, rgba(0, 119, 182, 0.9), rgba(0, 180, 216, 0.7));
            color: #ffffff;
            border-color: rgba(0, 212, 255, 0.9);
            box-shadow: 0 0 25px rgba(0, 180, 216, 0.6);
            transform: translateY(-2px);
        }

        hr {
            border: none;
            border-top: 1px solid rgba(0, 180, 216, 0.25);
            margin: 15px 0;
        }

        /* Page Transitions & Content */
        .page {
            display: none;
            animation: pageSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes pageSlideIn {
            0% { opacity: 0; transform: translateY(15px) scale(0.98); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* Profile & Details */
        .profile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00b4d8;
            box-shadow: 0px 0px 30px rgba(0, 180, 216, 0.8);
        }

        .title-animation {
            text-align: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .subtitle-animation {
            text-align: center;
            color: #00b4d8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Social Links */
        .social-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.4s ease;
        }

        .social-btn:hover {
            transform: scale(1.1) translateY(-3px);
        }

        .insta-btn { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .snap-btn { background: #FFFC00; color: #000000; }
        .threads-btn { background: #101010; color: #ffffff; border: 1px solid #333333; }

        /* About Card */
        .water-banner-card {
            background: linear-gradient(135deg, rgba(0, 119, 182, 0.3), rgba(0, 180, 216, 0.15)), rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(0, 180, 216, 0.6);
            border-radius: 20px;
            padding: 25px;
            margin-top: 15px;
            box-shadow: 0 0 35px rgba(0, 150, 255, 0.3);
            backdrop-filter: blur(12px);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="matrix-rain" id="matrixRain"></div>

    <div class="container">
        <div class="nav-container">
            <button class="nav-btn" id="homeBtn" onclick="showPage('home')">🏠 Home</button>
            <button class="nav-btn" id="aboutBtn" onclick="showPage('about')">👤 About</button>
            <button class="nav-btn" id="langBtn" onclick="toggleLang()">العربية 🌐</button>
        </div>

        <hr>

        <!-- Home Page -->
        <div id="homePage" class="page active">
            <div class="profile-container">
                <img src="IMG_20240908_230026_233.jpg" class="profile-img" alt="Meran Alyas">
            </div>
            <h1 class="title-animation" id="mainTitle">Welcome To My Account 👋</h1>
            <p class="subtitle-animation" id="subTitle">My social media accounts</p>

            <div class="social-container">
                <a href="https://www.instagram.com/meran.alyas/?__pwa=1" target="_blank" class="social-btn insta-btn"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.snapchat.com/add/meran.alyas" target="_blank" class="social-btn snap-btn"><i class="fa-brands fa-snapchat"></i></a>
                <a href="https://www.threads.net/@meran.alyas" target="_blank" class="social-btn threads-btn"><i class="fa-brands fa-threads"></i></a>
            </div>
        </div>

        <!-- About Page -->
        <div id="aboutPage" class="page">
            <h2 style="text-align: center; color: #00b4d8; margin-bottom: 15px;" id="aboutTitle">About Me 👤</h2>
            <div class="water-banner-card">
                <p style="font-size: 20px; font-weight: 700; color: #00b4d8; margin: 0;">🤖 Owner of TIGER Bot 🐅</p>
            </div>
        </div>
    </div>

    <script>
        // Matrix Rain Generation
        const rainContainer = id => document.getElementById(id);
        let rainHtml = '';
        for (let i = 0; i < 25; i++) {
            let leftPos = i * 4;
            let duration = 0.8 + (i % 4) * 0.4;
            rainHtml += `<div class="matrix-column" style="left: ${leftPos}%; animation-duration: ${duration}s;"></div>`;
        }
        rainContainer('matrixRain').innerHTML = rainHtml;

        // Language & Navigation
        let currentLang = 'en';

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            if (pageId === 'home') {
                document.getElementById('homePage').classList.add('active');
            } else if (pageId === 'about') {
                document.getElementById('aboutPage').classList.add('active');
            }
        }

        function toggleLang() {
            if (currentLang === 'en') {
                currentLang = 'ar';
                document.documentElement.dir = 'rtl';
                document.getElementById('homeBtn').innerText = '🏠 الرئيسية';
                document.getElementById('aboutBtn').innerText = '👤 عني';
                document.getElementById('langBtn').innerText = 'English 🌐';
                
                document.getElementById('mainTitle').innerText = 'أهلاً بك في حسابي 👋';
                document.getElementById('subTitle').innerText = 'حساباتي على وسائل التواصل الاجتماعي';
                document.getElementById('aboutTitle').innerText = 'نبذة عني 👤';
            } else {
                currentLang = 'en';
                document.documentElement.dir = 'ltr';
                document.getElementById('homeBtn').innerText = '🏠 Home';
                document.getElementById('aboutBtn').innerText = '👤 About';
                document.getElementById('langBtn').innerText = 'العربية 🌐';
                
                document.getElementById('mainTitle').innerText = 'Welcome To My Account 👋';
                document.getElementById('subTitle').innerText = 'My social media accounts';
                document.getElementById('aboutTitle').innerText = 'About Me 👤';
            }
        }
    </script>
</body>
</html>
